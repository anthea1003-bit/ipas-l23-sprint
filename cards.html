{id:'resid',t:'殘差圖四種形狀',ch:'5.3 評估驗證',times:'錯 4 次：考前14回 Q41（波浪選異質）、第5回 Q31（喇叭選自相關）、11/6 Q6（喇叭選共線性）、第7回 Q7（隨機散布選自相關）',
 q:'殘差圖：預測值越大，殘差散布越寬，整體像<b>喇叭</b>。這是什麼問題？怎麼處理？',
 k:'喇叭 → 異質變異 → 對 y 取 Log<br>U 形 → 漏了非線性 → 加二次項<br>隨時間規律起伏（橫軸是時間）→ 常為自相關 → 時序模型<br>隨機散布、寬度一致 → 模型形式沒問題；R² 低＝缺有資訊的特徵<br>共線性看 VIF，殘差圖看不出來',
 why:'三個形狀各對一種病、一種藥。喇叭是「寬度變」，U 形是「彎」，自相關是「順序有規律」。共線性是特徵之間的事，跟殘差圖無關。第 4 次錯是反過來：看到隨機散布卻硬說它自相關——沒有規律就是沒有病。',
 cq:'殘差對預測值呈 U 形（兩端為正、中間為負），寬度一致。最可能是？',ca:'漏掉非線性關係 → 加入二次項或交互作用項。寬度一致代表不是異質變異。'},
{id:'r2',t:'R² 怎麼讀',ch:'5.3 評估驗證',times:'錯 2 次：第5回 Q42（R²＝−0.35）、11/6 Q9（R²＝0.72）',
 q:'測試集 R²＝0.72 代表什麼？R²＝−0.35 又代表什麼？',
 k:'R²＝1 − RSS÷TSS ＝「被解釋的變異比例」<br>R²＜0 ＝ 輸給直接猜平均<br>不是準確率、不是誤差 %、不是信心水準',

 cq:'測試集 R²＝0 代表？',ca:'預測效果跟直接猜測試集平均值一樣（RSS＝TSS）。'},
{id:'dp',t:'差分隱私 ε 方向',ch:'6.1 隱私合規',times:'錯 3 次：Ken U4-03、第5回 Q19、11/6 治理 Q4',
 q:'隱私預算 ε 從 1.0 調成 0.1，雜訊、隱私、準確度各怎麼變？',
 k:'ε ＝「允許洩漏的額度」<br>額度小 ＝ 管得嚴 ＝ 雜訊多 ＝ 隱私強 ＝ 不準<br>ε 大：雜訊少、資料準、隱私弱',

 cq:'另一平台把 ε 從 0.1 調高到 10，結果？',ca:'雜訊變小、隱私變弱、準確度提升。'},

 q:'群組 1：判定率 32%、TPR 0.70、FPR 0.24；群組 2：判定率 31%、TPR 0.52、FPR 0.45。哪些公平性指標成立？',
 k:'各指標看固定欄位：<br>統計均等（群體平等）→ 看判定率<br>機會平等 → 看 TPR<br>均等勝算（均衡機率）→ 同時看 TPR ＋ FPR 兩欄',
 why:'判定率 32 vs 31 很接近 → 統計均等成立；TPR 0.70 vs 0.52 差很多 → 機會平等不成立；TPR、FPR 都不同 → 均等勝算不成立。題幹寫「實際會／實際不會」兩個條件，就是 TPR＋FPR。',
 cq:'委員會只要求「實際會再犯的人當中，各族群被抓到的比例相同」，是哪個指標？',ca:'機會平等（只約束 TPR）。'},
{id:'debias',t:'去偏三階段：用限制刪選項',ch:'6.2 偏見公平',times:'錯 2 次：第5回 Q14、11/6 治理 Q5',

 k:'先拿題幹限制刪選項：<br>資料不能動 → 刪前處理<br>推論不能用敏感欄 → 刪後處理（分群門檻、分群校準都要用到年齡）<br>剩下 → 模型內處理（損失函數加公平性約束）<br>另外：門檻動＝門檻調整；分數動＝結果校準',
 why:'去偏題幾乎都在考「看懂限制」。先刪再選，不要直接找看起來最合理的。後處理分兩種：改門檻叫門檻調整，改分數叫結果校準。',
 cq:'分數都不動，但 B 群體 55 分就通過、A 群體仍要 60 分。屬於？',ca:'後處理｜門檻調整（分數沒動、各群門檻不同）。'},
{id:'cm',t:'混淆矩陣：FP 與 FN 別對調',ch:'5.3 評估驗證',times:'錯 3 次：10/3、同學出的卷 Q4、11/2 檢核題初答',
 q:'TP＝2、FP＝1、FN＝2，Precision 和 Recall 各是多少？',
 k:'先看「預測」，再看「對不對」：<br>預測正卻錯 ＝ FP；預測負卻錯 ＝ FN<br>Precision ＝ TP ÷ (TP＋FP) → 看「預測為正」那一欄（排欄依題目矩陣，先認清哪邊是預測）<br>Recall ＝ TP ÷ (TP＋FN) → 看「實際為正」那一排',
 why:'Precision＝2÷3＝0.67，Recall＝2÷4＝0.5。每次錯都是把 FP、FN 算反，先問「模型說它是什麼」就不會反。',
 cq:'門檻從 0.5 降到 0.3，Precision、Recall 怎麼變？',ca:'Recall 上升、Precision 通常下降（網子放寬：抓得多也抓錯多）。'},
{id:'scale',t:'÷255 是 Min-Max 不是 Z-score',ch:'5.1 特徵工程',times:'錯 2 次：考前14回 Q21、11/6 Q8',
 q:'X_train / 255.0、X_test / 255.0 是哪種縮放？測試集該用誰的參數？',
 k:'有「減平均、除標準差」才是 Z-score（StandardScaler）<br>(x − min) ÷ (max − min) 壓到 0～1 是 Min-Max<br>÷255 ＝ (x − 0) ÷ (255 − 0) → Min-Max<br>測試集一律用訓練集的參數',
 why:'÷255 沒有減平均，所以不可能是 Z-score；像素的 min 是 0、max 是 255，÷255 剛好就是 Min-Max 公式。縮放器只 fit 訓練集，再 transform 兩邊。',
 cq:'StandardScaler 應該 fit 在哪裡？',ca:'只 fit 訓練集，然後 transform 訓練集與測試集；用測試集自己的統計量就是資料洩漏。'},
{id:'lag',t:'拉格朗日對偶（指引外，背口訣）',ch:'3.3 數值優化',times:'錯 2 次：Ken U1-09 第一刷（乘數正負）、二刷（弱對偶方向）',
 q:'SVM 對偶問題：乘數可以是負的嗎？弱對偶是 d* 大於還是小於 p*？什麼時候間隙為 0？',
 k:'不等式乘數不能負，等式乘數隨便你<br>對偶在下面撐著：d* ≤ p*（弱對偶）<br>凸 ＋ Slater 即可保證貼齊：間隙＝0（強對偶）<br>對偶函數恆為凹，不是凸',
 why:'學習指引沒有這題，考到就是送分或送命，背四句即可。兩次錯分別踩在前兩句。',
 cq:'「對偶最佳值恆大於原始極小值，稱為弱對偶」這句對嗎？',ca:'錯。弱對偶是 d* ≤ p*，對偶值在下面。'},
{id:'bayes',t:'貝氏：聯合機率還要除以邊際',ch:'3.1 機率統計',times:'錯 2 次：第5回 Q37（分母 0.215 是什麼）、第7回 Q14（停在 0.18 沒除 0.22）',
 q:'盛行率 20%，患病者 90% 驗出陽性，沒病者 5% 誤判陽性。驗出陽性真的患病的機率？',
 k:'聯合 ＝ 患病 × 陽性率 ＝ 0.20 × 0.90 ＝ 0.18<br>邊際 ＝ 兩條路加總 ＝ 0.18 ＋ 0.80 × 0.05 ＝ 0.22<br>後驗 ＝ 聯合 ÷ 邊際 ＝ 0.18 ÷ 0.22 ≈ 0.82<br>口訣：算到聯合先別停，除以「所有會陽性的」才是答案',
 why:'兩次錯都卡在分母：第 5 回不知道 0.215 是「兩條路線加總」，第 7 回算到 0.18 就當答案。貝氏的分母永遠是「證據出現的總機率」，患病的那條＋沒病的那條。',
 cq:'先驗 0.3，證據在兩類下的機率分別是 0.6、0.2。分母 P(證據) 是多少？',ca:'0.3×0.6 ＋ 0.7×0.2 ＝ 0.18 ＋ 0.14 ＝ 0.32。'},
{id:'act',t:'激活函數值域：輸出層要配得上目標',ch:'4.3 深度學習',times:'錯 3 次：同學卷 Q35（把 Sigmoid 特性當 ReLU）、第7回 Q9（房價迴歸用 Sigmoid 輸出層）、L232 第二卷 Q10（Softmax 拿去做多標籤）；第5回 Q29 Tanh 答對不確定',
 q:'房價 800～3,000，網路最後一層用 Sigmoid、損失用 MSE，訓練完預測全部卡在 1 附近。問題在哪？',
 k:'Sigmoid → 0～1（二元機率）<br>Tanh → −1～1（以 0 為中心）<br>ReLU → 0～∞，正區間梯度恆為 1，負的歸 0（不是絕對值）<br>迴歸輸出層 → 恆等（線性），沒有上下界<br>Softmax 輸出層 → 強制全部加總＝1，等於逼模型只選一類（多類別、單標籤）；多標籤要每類各自一個 Sigmoid<br>口訣：先問「目標的範圍」，輸出層值域碰不到就是錯；Softmax 強制加總為 1＝只能選一類',
 why:'問題不在 ReLU 配 MSE，是 Sigmoid 把輸出鎖在 0～1，800～3,000 永遠碰不到。同學卷那題則是把「輸出限制在 0～1」安到 ReLU 頭上。第二卷那題被「總和為 1」前半句騙過：Softmax 強制總和為 1，等於只能選一類；多標籤一張圖可以同時是貓又是室內，要各自 Sigmoid。四個函數各記一個範圍、Softmax 記「互斥」就不會混。',
 cq:'輸出要可正可負、以 0 為中心、上下對稱，選哪個？',ca:'Tanh（−1～1，中心為 0）。'},
{id:'l1l2',t:'L1 歸零選特徵，L2 縮小不歸零；Elastic Net 看 l1_ratio',ch:'5.4 調整優化',times:'錯 2 次：第7回 Q2（係數路徑圖 6 條變 0 卻選早停）、L232 第二卷 Q2（共線性下把 l1_ratio=1.0 當「兼顧兩者」）',
 q:'係數路徑圖：λ 變大後 10 條線有 6 條精確變成 0 並維持 0，其餘 4 條縮小但不歸 0。這是哪種正則化？另一題：特徵高度共線、想留整組相關特徵且係數穩定，Elastic Net 的 l1_ratio 設 1.0 對嗎？',
 k:'L1（Lasso）→ 絕對值懲罰，不重要的係數被壓成 0 → 稀疏、順便選特徵<br>L2（Ridge）→ 平方懲罰，係數一起縮小但不會精確為 0；共線特徵一起留、係數穩<br>Elastic Net：l1_ratio＝1 就是純 Lasso，＝0 就是純 Ridge；要「留整組＋穩定」就要保留 L2 份量（l1_ratio＜1；純 Ridge 也行，要順便選特徵才取中間）<br>早停通常只是提早停，不保證係數歸零（考題拿來當排除項）<br>口訣：L1 歸零選特徵，L2 縮小不歸零',
 why:'係數「精確變 0」要有 L1 成分才做得到（Lasso，或 Elastic Net 裡的 L1 部分），Ridge 再大的 λ 也只是趨近 0；早停也不保證。第二題被「兼顧兩者」四個字吸引，但 l1_ratio=1.0 等於 L1 佔 100%、L2 佔 0，Elastic Net 退化成純 Lasso，共線特徵留誰不固定、係數不穩，正好和題目要的相反。',
 cq:'Ridge 把 λ 調到很大，係數會不會剛好等於 0？',ca:'不會，只會越來越接近 0；要精確為 0 要用 L1。'},
];
const KEY='s3_rep_cards_v1'; let st={}; try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){st={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function render(){const d=document.getElementById('deck'); d.innerHTML=CARDS.map((c,i)=>`<div class="card ${st[c.id]||''}" id="c_${c.id}"><div class="head"><h2>${i+1}. ${c.t}</h2><span class="chip">${c.ch}</span></div><div class="times">${c.times}</div><div class="q">${c.q}</div><div class="back"><div class="fig">${FIGS[c.id]||''}</div><div class="koujue">${c.k}</div><div class="why">${c.why}</div><div class="check" id="k_${c.id}"><b>檢核：</b>${c.cq} <small onclick="document.getElementById('k_${c.id}').classList.toggle('show')">（點我看答案）</small><div class="ans">${c.ca}</div></div></div><div class="btns"><button class="flip" onclick="document.getElementById('c_${c.id}').classList.toggle('open')">翻面</button><button class="y" onclick="mark('${c.id}','ok')">記得</button><button class="n" onclick="mark('${c.id}','ng')">不記得</button></div></div>`).join(''); stat();}
function mark(id,v){st[id]=v;save();const el=document.getElementById('c_'+id);el.classList.remove('ok','ng');el.classList.add(v);stat();}
function openAll(o){document.querySelectorAll('.card').forEach(e=>e.classList.toggle('open',o))}
function reset(){st={};save();render();}
function stat(){const ok=Object.values(st).filter(v=>v==='ok').length,ng=Object.values(st).filter(v=>v==='ng').length;document.getElementById('stat').textContent=`記得 ${ok}／不記得 ${ng}／未答 ${CARDS.length-ok-ng}`;const s=document.getElementById('sum');s.textContent=ng?`還有 ${ng} 張不記得：${CARDS.filter(c=>st[c.id]==='ng').map(c=>c.t).join('、')}。明天先從這幾張開始。`:(ok===CARDS.length?`${CARDS.length} 張全部記得。明天再跑一輪，連續三天全對才算關掉。`:'做完一輪後這裡會列出「不記得」的卡。');}
render();
</script></body></html>
